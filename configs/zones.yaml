# Zone roster and per-type behavioural profiles.
#
# Hourly shapes are expressed as a baseline plus a set of Gaussian peaks over
# the 24-hour clock (wrapping at midnight). Each profile is normalised so its
# 24-hour mean equals 1.0, which makes `base_demand` directly readable as
# "average calculated rides per 15-minute interval for this zone".

zone_types:

  city_center:
    demand_profile:
      baseline: 0.50
      peaks:
        - {hour: 9.0,  width: 1.2, amplitude: 0.70}
        - {hour: 13.0, width: 1.5, amplitude: 0.50}
        - {hour: 18.0, width: 1.6, amplitude: 1.10}
        - {hour: 21.5, width: 1.3, amplitude: 0.80}
    supply_profile:
      baseline: 0.60
      peaks:
        - {hour: 9.0,  width: 2.0, amplitude: 0.80}
        - {hour: 18.0, width: 2.0, amplitude: 0.90}
        - {hour: 22.0, width: 2.0, amplitude: 0.50}
    weekend_demand_multiplier: 1.05
    supply_per_demand: 1.3
    base_traffic: 0.75
    base_eta_minutes: 2.6
    distance_decay_exponent: 1.5
    destination_attractiveness:
      night: 0.8
      morning: 1.3
      midday: 1.5
      evening: 1.6
      late: 1.3

  business:
    demand_profile:
      baseline: 0.25
      peaks:
        - {hour: 8.5,  width: 1.1, amplitude: 1.70}
        - {hour: 13.0, width: 1.0, amplitude: 0.50}
        - {hour: 18.0, width: 1.2, amplitude: 1.50}
    supply_profile:
      baseline: 0.50
      peaks:
        - {hour: 8.5,  width: 1.5, amplitude: 1.00}
        - {hour: 18.0, width: 1.5, amplitude: 1.00}
    weekend_demand_multiplier: 0.30
    supply_per_demand: 1.25
    base_traffic: 0.65
    base_eta_minutes: 2.9
    distance_decay_exponent: 1.6
    destination_attractiveness:
      night: 0.2
      morning: 2.2
      midday: 1.2
      evening: 0.5
      late: 0.2

  residential:
    demand_profile:
      baseline: 0.35
      peaks:
        - {hour: 7.5,  width: 1.2, amplitude: 1.50}
        - {hour: 19.0, width: 1.6, amplitude: 1.00}
    supply_profile:
      baseline: 0.55
      peaks:
        - {hour: 8.0,  width: 1.5, amplitude: 0.90}
        - {hour: 18.5, width: 1.8, amplitude: 0.80}
    weekend_demand_multiplier: 0.85
    supply_per_demand: 1.35
    base_traffic: 0.40
    base_eta_minutes: 4.8
    distance_decay_exponent: 1.7
    destination_attractiveness:
      night: 1.8
      morning: 0.6
      midday: 0.9
      evening: 2.0
      late: 1.9

  # With civil aviation closed, rail carries intercity travel, so the station
  # zones are the city's long-distance gateways. They get a weaker distance
  # decay than ordinary zones because people cross the whole city to catch a
  # train, and a sharp peak just after the curfew lifts, when the first
  # departures and overnight arrivals cluster.
  railway_station:
    demand_profile:
      baseline: 0.45
      peaks:
        - {hour: 5.5,  width: 1.0, amplitude: 1.30}
        - {hour: 8.0,  width: 1.3, amplitude: 1.00}
        - {hour: 13.0, width: 1.5, amplitude: 0.60}
        - {hour: 18.0, width: 1.3, amplitude: 1.10}
        - {hour: 22.0, width: 1.2, amplitude: 0.90}
    supply_profile:
      baseline: 0.60
      peaks:
        - {hour: 6.0,  width: 1.3, amplitude: 0.70}
        - {hour: 8.0,  width: 1.5, amplitude: 0.80}
        - {hour: 18.0, width: 1.5, amplitude: 0.90}
    weekend_demand_multiplier: 0.90
    supply_per_demand: 1.15
    base_traffic: 0.60
    base_eta_minutes: 2.8
    distance_decay_exponent: 1.2
    destination_attractiveness:
      night: 0.28
      morning: 0.66
      midday: 0.55
      evening: 0.55
      late: 0.50

  # Nightlife runs early. Venues have to empty before the curfew, so the demand
  # peak sits in the late evening and there is no post-midnight tail at all --
  # the opposite of what this zone type looks like in a city without one.
  entertainment:
    demand_profile:
      baseline: 0.20
      peaks:
        - {hour: 19.5, width: 1.6, amplitude: 1.10}
        - {hour: 22.3, width: 1.3, amplitude: 1.80}
    supply_profile:
      baseline: 0.35
      peaks:
        - {hour: 19.5, width: 1.8, amplitude: 0.80}
        - {hour: 22.0, width: 1.5, amplitude: 0.90}
    weekend_demand_multiplier: 1.60
    supply_per_demand: 0.95
    base_traffic: 0.50
    base_eta_minutes: 4.2
    distance_decay_exponent: 1.5
    destination_attractiveness:
      night: 1.2
      morning: 0.2
      midday: 0.5
      evening: 1.3
      late: 2.0

  suburban:
    demand_profile:
      baseline: 0.30
      peaks:
        - {hour: 7.0,  width: 1.2, amplitude: 1.30}
        - {hour: 18.5, width: 1.5, amplitude: 0.90}
    supply_profile:
      baseline: 0.40
      peaks:
        - {hour: 7.5,  width: 1.5, amplitude: 0.80}
        - {hour: 18.0, width: 1.8, amplitude: 0.60}
    weekend_demand_multiplier: 0.75
    supply_per_demand: 0.9
    base_traffic: 0.25
    base_eta_minutes: 7.0
    distance_decay_exponent: 1.8
    destination_attractiveness:
      night: 1.0
      morning: 0.4
      midday: 0.7
      evening: 1.4
      late: 1.1

# Hour buckets used by `destination_attractiveness`.
hour_bands:
  night:   [0, 1, 2, 3, 4, 5]
  morning: [6, 7, 8, 9, 10]
  midday:  [11, 12, 13, 14, 15]
  evening: [16, 17, 18, 19, 20]
  late:    [21, 22, 23]

# `distance_km` / `bearing_degrees` position each zone relative to the city
# centre defined in simulation.yaml. `base_demand` is the average number of
# calculated rides per 15-minute interval before any time-of-day shaping.
zones:
  # Wartime Kyiv labels: real place names, no invented nightlife districts.
  # `entertainment` = evening / weekend / event-driven demand, not clubbing.
  - {zone_id: Z01, zone_name: "Podil / Kontraktova",           zone_type: entertainment,  distance_km: 2.0,  bearing_degrees: 340, base_demand: 2.8}
  - {zone_id: Z02, zone_name: Khreshchatyk,                   zone_type: city_center,     distance_km: 0.5,  bearing_degrees: 90,  base_demand: 4.2}
  - {zone_id: Z03, zone_name: "Pechersk CBD / Klovska",       zone_type: business,        distance_km: 3.0,  bearing_degrees: 135, base_demand: 2.6}
  - {zone_id: Z04, zone_name: "Olimpiiska Business District", zone_type: business,        distance_km: 2.2,  bearing_degrees: 200, base_demand: 2.2}
  - {zone_id: Z05, zone_name: UNIT.City,                      zone_type: business,        distance_km: 6.5,  bearing_degrees: 25,  base_demand: 1.6}
  - {zone_id: Z06, zone_name: "Obolon / Minska",              zone_type: residential,     distance_km: 8.0,  bearing_degrees: 350, base_demand: 2.8}
  - {zone_id: Z07, zone_name: Troieshchyna,                   zone_type: residential,     distance_km: 11.0, bearing_degrees: 30,  base_demand: 3.2}
  - {zone_id: Z08, zone_name: Solomianka,                     zone_type: residential,     distance_km: 5.0,  bearing_degrees: 250, base_demand: 2.4}
